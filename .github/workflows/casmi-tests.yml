name: CASMI26 pipeline tests
on:
  push:
    branches: [main]
    paths:
      - 'predict.py'
      - 'work/casmi26/**'
      - '.github/workflows/casmi-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r work/casmi26/requirements.txt pytest
      - run: python -m pytest -q work/casmi26/tests
      - run: python predict.py --help
