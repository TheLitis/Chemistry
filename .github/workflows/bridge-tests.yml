name: Bridge and runner tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  powershell-parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse bridge and runner PowerShell scripts
        shell: powershell
        run: .\tests\Test-BridgeScripts.ps1
      - name: Validate controlled runner requests
        shell: powershell
        run: .\tests\Test-RunnerRequest.ps1
      - name: Verify permanent SYSTEM runner mode
        shell: powershell
        run: .\tests\Test-SystemMode.ps1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test compute-smoke sizing logic
        shell: powershell
        run: |
          python -m pip install pytest
          python -m pytest -q runner/test_compute_smoke.py
