name: ChemistryPC health

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'runner/health-trigger.txt'

permissions:
  contents: read

concurrency:
  group: chemistry-pc-exclusive
  cancel-in-progress: false

jobs:
  health:
    runs-on: [self-hosted, Windows, X64, ChemistryPC]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Provision job Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Hardware diagnostics
        shell: powershell
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'chemistry-health'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          .\runner\diagnostics.ps1 -OutputDirectory $out

      - name: Compute smoke test
        shell: powershell
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'chemistry-health'
          $cfgPath = Join-Path $env:ProgramData 'ChemistryRunner\machine.json'
          $maxRam = 8
          if (Test-Path $cfgPath) {
            $cfg = Get-Content $cfgPath -Raw | ConvertFrom-Json
            if ($cfg.maxRamSmokeGiB) { $maxRam = [double]$cfg.maxRamSmokeGiB }
          }
          python .\runner\compute_smoke.py --output (Join-Path $out 'compute-smoke.json') --max-ram-gib $maxRam
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload health reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chemistry-pc-health-${{ github.run_id }}
          path: ${{ runner.temp }}\chemistry-health\*
          if-no-files-found: warn
