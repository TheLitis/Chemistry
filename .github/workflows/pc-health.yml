name: ChemistryPC health

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chemistry-pc-exclusive
  cancel-in-progress: false

jobs:
  health:
    runs-on: [self-hosted, Windows, X64, ChemistryPC]
    timeout-minutes: 45
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - uses: actions/checkout@v4

      - name: Verify permanent SYSTEM identity
        run: |
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $sid = $identity.User.Value
          Write-Host "Execution identity: $($identity.Name) ($sid)"
          if ($sid -ne 'S-1-5-18') {
            throw "ChemistryPC health requires NT AUTHORITY\SYSTEM (S-1-5-18). Current: $($identity.Name) ($sid)."
          }

      - name: Preflight hardware diagnostics
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'chemistry-health-pre'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          .\runner\diagnostics.ps1 -OutputDirectory $out

      - name: Bootstrap persistent Chemistry Python
        run: |
          .\runner\bootstrap-python.ps1
          $python = Join-Path $env:ProgramData 'ChemistryRunner\python\python.exe'
          if (-not (Test-Path $python)) { throw "Chemistry Python missing after bootstrap: $python" }
          "CHEMISTRY_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Split-Path -Parent $python) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $python --version
          & $python -m pip --version

      - name: Bootstrap CUDA PyTorch
        run: |
          .\runner\bootstrap-torch.ps1 -PythonExe $env:CHEMISTRY_PYTHON

      - name: Hardware diagnostics
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'chemistry-health'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          .\runner\diagnostics.ps1 -OutputDirectory $out

      - name: Compute smoke test with required CUDA
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'chemistry-health'
          $cfgPath = Join-Path $env:ProgramData 'ChemistryRunner\machine.json'
          $maxRam = 8
          if (Test-Path $cfgPath) {
            $cfg = Get-Content $cfgPath -Raw | ConvertFrom-Json
            if ($cfg.maxRamSmokeGiB) { $maxRam = [double]$cfg.maxRamSmokeGiB }
          }
          & $env:CHEMISTRY_PYTHON .\runner\compute_smoke.py --output (Join-Path $out 'compute-smoke.json') --max-ram-gib $maxRam --require-cuda
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload health reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chemistry-pc-health-${{ github.run_id }}
          path: |
            ${{ runner.temp }}\chemistry-health-pre\*
            ${{ runner.temp }}\chemistry-health\*
          if-no-files-found: warn
